name: Build PhatTrack AU

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get JUCE
        run: git clone --depth 1 --branch 8.0.6 https://github.com/juce-framework/JUCE.git "$HOME/JUCE"
      - name: Configure
        run: cmake -B build -S . -DJUCE_PATH="$HOME/JUCE" -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build AU
        run: cmake --build build --config Release --target PhatTrack_AU -j
      - name: Sign locally
        run: codesign --force --deep --sign - build/PhatTrack_artefacts/Release/AU/PhatTrack.component
      - name: Zip component
        run: cd build/PhatTrack_artefacts/Release/AU && ditto -c -k --keepParent PhatTrack.component "$GITHUB_WORKSPACE/PhatTrack-AU.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PhatTrack-AU
          path: PhatTrack-AU.zip
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Newest PhatTrack build"; gh release upload latest PhatTrack-AU.zip --clobber
